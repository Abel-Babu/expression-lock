<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arup Global Treasury & Clearing Portal</title>
  <link rel="stylesheet" href="ink_wash.css">
</head>
<body class="standalone-portal">

  <!-- Pure Corporate Treasury Website (No developer nav bar) -->
  <main id="app-view">
    <!-- Populated by portal.js -->
  </main>

  <!-- Expression Lock Action Gate Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" style="display: none;">
    <div class="modal-content" id="el-modal">
      <div class="modal-header">
        <span class="modal-title">Expression Lock: Action Gate</span>
        <button id="close-modal-btn" class="close-btn" onclick="window.closeModal && window.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="el-modal-body">
        <!-- Live camera & AI face mesh injected here -->
      </div>
    </div>
  </div>

  <script type="module">
    import { renderPortal } from './src/portal.js';
    import './src/modal.js';

    document.addEventListener('DOMContentLoaded', () => {
      const appView = document.getElementById('app-view');
      renderPortal(appView);
    });
  </script>
</body>
</html>

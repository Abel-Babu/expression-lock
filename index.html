<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expression Lock</title>
  <link rel="stylesheet" href="ink_wash.css">
</head>
<body>
  <nav>
    <a href="#/portal" id="nav-portal">Portal</a>
    <a href="#/org" id="nav-org">Org Console</a>
    <a href="#/host" id="nav-host">Host Panel</a>
    <a href="#/participant" id="nav-participant">Participant</a>
    <a href="hub.html" style="margin-left: auto; color: var(--primary-accent); border: 1px solid var(--primary-accent); padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.85rem; text-decoration: none; font-weight: 600; letter-spacing: 0.3px;">Launchpad &rarr;</a>
  </nav>

  <div id="debug-error-overlay" style="color: red; background: #111; padding: 10px; font-family: monospace; z-index: 9999;"></div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('debug-error-overlay').innerHTML += '<br/>ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('debug-error-overlay').innerHTML += '<br/>PROMISE REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>

  <main id="app-view">
    <!-- View content injected here by app.js -->
  </main>

  <!-- Expression Lock Modal (Hidden by default) -->
  <div id="modal-overlay" class="modal-overlay hidden" style="display: none;">
    <div class="modal-content" id="el-modal">
      <div class="modal-header">
        <span class="modal-title">Expression Lock: Action Gate</span>
        <button id="close-modal-btn" class="close-btn" onclick="window.closeModal && window.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="el-modal-body">
        <p>Zero-Trust Biometric Engine loading...</p>
        <!-- Phase 2 will inject the camera and face mesh here -->
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
